name: KintampoMarket
options:
  bundleIdPrefix: com.kintampoafricanmarket
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
    watchOS: "10.0"
  xcodeVersion: "15.0"
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
packages:
  Stripe:
    url: https://github.com/stripe/stripe-ios.git
    exactVersion: 25.9.0
targets:
  KintampoMarket:
    type: application
    platform: iOS
    sources:
      - path: KintampoMarket
        excludes:
          - Info.plist
          - Info-macOS.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kintampoafricanmarket.app
        INFOPLIST_FILE: KintampoMarket/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - package: Stripe
        product: StripePaymentSheet
    scheme:
      testTargets: []
    postCompileScripts: []

  KintampoMarketMac:
    type: application
    platform: macOS
    sources:
      - path: KintampoMarket
        excludes: [Info.plist, Info-macOS.plist]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kintampoafricanmarket.app.mac
        INFOPLIST_FILE: KintampoMarket/Info-macOS.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"

  KintampoMarketWatch:
    type: application
    platform: watchOS
    sources:
      - path: KintampoMarket/KintampoMarketApp.swift
      - path: KintampoMarket/Platform/WatchRootView.swift
      - path: KintampoMarket/Theme
      - path: KintampoMarket/Models
      - path: KintampoMarket/Services
      - path: KintampoMarket/ViewModels
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kintampoafricanmarket.app.watchkitapp
        INFOPLIST_FILE: KintampoMarketWatch/Info.plist
        WKCompanionAppBundleIdentifier: com.kintampoafricanmarket.app
    dependencies:
      - target: KintampoMarket

schemes:
  KintampoMarket:
    build:
      targets:
        KintampoMarket: all
    run:
      config: Debug
